 let seed=742337;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
 function makeParticles(parent,cl,n,html){const el=document.getElementById(parent);for(let i=0;i<n;i++){const x=document.createElement('span');x.className=cl;const d=html(i);for(const [key,value] of Object.entries(d))x.style.setProperty(key,value);el.appendChild(x)}}

function findCue(t){let low=0,high=cues.length-1;while(low<=high){const mid=(low+high)>>1;if(cues[mid].t<=t)low=mid+1;else high=mid-1}return Math.max(0,high)}
function getCaption(t){
 if(t<26.13)return{key:t<12.9?'quote1':'quote2',text:t<12.9?q1:q2};
 const i=findCue(t),cue=cues[i],next=cues[i+1];
 if(cue.text)return{key:'lyric-'+i,text:cue.text};
 // Small rests retain the preceding lyric, rather than insert an unrelated quote.
 if(next && next.t-cue.t<9){for(let j=i-1;j>=0;j--)if(cues[j].text)return{key:'hold-'+j,text:cues[j].text}}
 const section=breaks.find(b=>t>=b.start&&t<b.end);
 if(section){let line=section.lines[0];for(const candidate of section.lines)if(t>=candidate.at)line=candidate;return{key:'note-'+line.at,text:line.text}}
 for(let j=i-1;j>=0;j--)if(cues[j].text)return{key:'hold-'+j,text:cues[j].text};
 return{key:'quote1',text:q1};
}
function displayLyric(t){
 const item=getCaption(t);if(item.key===lastCue && !(lastTime>=0&&t<lastTime-1))return;
 lastCue=item.key;
 lyricEl.textContent=item.text;
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
  lyricEl.getAnimations().filter(a=>a.effect && a.effect.getKeyframes().some(f=>f.opacity===0)).forEach(a=>a.cancel());
  lyricEl.animate([{opacity:0,transform:'translateY(22px) scale(.965)',filter:'blur(6px)'},{opacity:.5,transform:'translateY(8px) scale(.99)',filter:'blur(2px)',offset:.6},{opacity:1,transform:'translateY(0) scale(1)',filter:'blur(0px)'}],{duration:1020,easing:'cubic-bezier(.18,.8,.2,1)'});
 }
}
function message(text){toast.textContent=text;toast.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.hidden=true,3200)}
function youtubeTime(){
 if(!ytReady||!ytPlayer)return 0;
 try{const n=ytPlayer.getCurrentTime();return Number.isFinite(n)?Math.max(0,n):0}catch(e){return 0}
}
function youtubeDuration(){
 if(!ytReady||!ytPlayer)return approxDuration;
 try{const n=ytPlayer.getDuration();return Number.isFinite(n)&&n>0?n:approxDuration}catch(e){return approxDuration}
}
function isPlaying(){return ytReady&&ytState===YT.PlayerState.PLAYING}
function updatePlay(){
 const playing=isPlaying();playBtn.textContent=playing?'❚❚':'▶';playBtn.title=playing?'Pause':'Play';
 playBtn.setAttribute('aria-label',playing?'Pause Lovesong':'Play Lovesong');
 document.body.classList.toggle('is-playing',playing);
}
function playOrPause(){
 if(!ytReady||!ytPlayer){queuedPlay=true;message('Preparing the YouTube song…');return}
 try{
  if(isPlaying()){ytPlayer.pauseVideo()}
  else{ytPlayer.playVideo(); document.body.classList.add('has-song')}
 }catch(e){message('Tap Play on the YouTube player ♡')}
}
mainBtn.addEventListener('click',playOrPause);
playBtn.addEventListener('click',playOrPause);
rewindBtn.addEventListener('click',()=>{
 if(!ytReady||!ytPlayer){message('Loading the YouTube song…');return}
 const next=Math.max(0,youtubeTime()-10);
 ytPlayer.seekTo(next,true);lastCue='';displayLyric(next)
});
seek.addEventListener('input',()=>{
 if(!ytReady||!ytPlayer)return;
 const next=Number(seek.value)/1000*youtubeDuration();
 ytPlayer.seekTo(next,true);lastCue='';displayLyric(next);
});
function formatTime(t){const n=Math.max(0,Math.floor(Number.isFinite(t)?t:0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
let lastFrame=0;
function frame(now){
 requestAnimationFrame(frame);
 if(now-lastFrame<85)return;
 lastFrame=now;
 const t=youtubeTime(),d=youtubeDuration();
 displayLyric(t);
 timeEl.textContent=formatTime(t)+' / '+formatTime(d);
 seek.value=String(Math.min(1000,Math.round(t/Math.max(1,d)*1000)));
 const ambient=isPlaying() ? .22+.14*Math.sin(now/740) : 0;
 document.documentElement.style.setProperty('--reactive',Math.max(0,ambient).toFixed(3));
 lastTime=t;
}
function initYoutube(){
 const script=document.createElement('script');
 script.src='https://www.youtube.com/iframe_api'; script.async=true;
 script.onerror=()=>{message('YouTube unavailable. Tap ↗ to open the song.')};
 window.onYouTubeIframeAPIReady=()=>{
  ytPlayer=new YT.Player('youtube-player',{
   width:'200',height:'200',videoId:'NSec3LfUWxE',
   playerVars:{playsinline:1,controls:0,rel:0,modestbranding:1,iv_load_policy:3},
   events:{
    onReady:()=>{
      ytReady=true;updatePlay();
      if(queuedPlay){queuedPlay=false;ytPlayer.playVideo();document.body.classList.add('has-song')}
    },
    onStateChange:e=>{
      ytState=e.data;
      if(e.data===YT.PlayerState.PLAYING){document.body.classList.add('has-song');toast.hidden=true}
      if(e.data===YT.PlayerState.ENDED)message('For you, always ♡');
      updatePlay();
    },
    onError:()=>message('Embedded playback blocked. Tap ↗ to watch on YouTube.')
   }
  });
 };
 document.head.appendChild(script);
}
updatePlay();requestAnimationFrame(frame);initYoutube();
