.bouquet::before,.bouquet::after{content:"";position:absolute;inset:0;background:inherit;background-size:contain;background-repeat:no-repeat;background-position:center;mix-blend-mode:screen;opacity:.24;filter:blur(3px)}.bouquet::before{transform:translate(1%,-.8%) skewY(.8deg)}.bouquet::after{transform:translate(-1.2%,.9%) skewX(-.8deg);opacity:.16}

.brand{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:94vw;text-align:center;z-index:10;pointer-events:none}.brand h1{margin:0;font-size:clamp(24px,5.3vw,38px);font-weight:750;letter-spacing:-.03em;color:#ffe9f7;text-shadow:0 0 14px rgba(255,82,191,.25)}
.stage{position:fixed;left:50%;top:51%;transform:translate(-50%,-50%);width:min(92vw,780px);min-height:220px;padding:12px 10px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:9}.lyric{margin:0;max-width:100%;font-family:Georgia,serif;font-size:clamp(31px,6.2vw,56px);line-height:1.2;letter-spacing:-.03em;color:#fff6fd;text-wrap:balance;overflow-wrap:break-word;text-shadow:0 2px 20px rgba(0,0,0,.9),0 0 16px rgba(255,85,190,.12);transition:opacity .8s ease,transform .8s ease}
.lyric.glow{background:linear-gradient(110deg,#fff8fe 0%,#ffd0ed 24%,#fff7fd 40%,#ffc7ea 63%,#ff9fdc 82%,#fffafe 100%);background-size:220% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,98,191,.34));animation:glowShift 10s ease-in-out infinite alternate}.lyric.switching{opacity:0;transform:translateY(14px) scale(.987)}
.start-btn{margin-top:26px;padding:13px 24px;border-radius:999px;border:1px solid rgba(255,211,238,.5);background:linear-gradient(120deg,rgba(229,84,176,.86),rgba(135,79,216,.82));color:#fff;font-size:12px;font-weight:700;letter-spacing:.07em;box-shadow:0 0 24px rgba(255,61,177,.22), inset 0 1px 0 rgba(255,255,255,.2)}body.has-song .start-btn{display:none}
.controls-dock{margin-top:18px;width:min(330px,85vw);padding:8px 10px 6px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,211,238,.10);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.controls{display:flex;align-items:center;justify-content:center;gap:10px}.ctrl{display:grid;place-items:center;min-width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,220,245,.16);background:rgba(255,255,255,.05);color:#fff4fb;padding:0 4px;font-size:16px;line-height:1}.ctrl.play{min-width:44px;height:44px;font-size:18px;background:linear-gradient(120deg,rgba(238,83,182,.84),rgba(133,95,247,.84));box-shadow:0 0 16px rgba(255,91,190,.18)}.ctrl small{font-size:9px}.song-name{display:none}.progress{display:flex;align-items:center;gap:6px;margin-top:8px}.progress input{flex:1;min-width:0;height:15px;accent-color:#ff86d5}.time{font-size:10px;color:#d9bfd7;font-variant-numeric:tabular-nums}
.yt-shell{position:fixed;left:50%;top:max(72px,env(safe-area-inset-top)+58px);transform:translateX(-50%);z-index:14;width:200px;height:200px;border-radius:14px;overflow:hidden;background:#000;border:1px solid rgba(255,208,235,.18);box-shadow:0 10px 28px rgba(0,0,0,.45);transition:opacity .35s ease,transform .35s ease,visibility .35s ease}.yt-shell iframe,.yt-shell #youtube-player{display:block;width:200px!important;height:200px!important;border:0;background:#000}body.yt-collapsed .yt-shell{opacity:0;visibility:hidden;transform:translateX(-50%) translateY(-22px) scale(.84);pointer-events:none}
.reveal-player{position:fixed;left:50%;top:max(76px,env(safe-area-inset-top)+62px);transform:translateX(-50%);z-index:15;padding:0 14px;height:34px;border-radius:999px;border:1px solid rgba(255,215,241,.18);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .3s ease}body.yt-collapsed .reveal-player{opacity:1;visibility:visible}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:18;background:rgba(10,8,18,.92);color:#fff;border:1px solid rgba(255,212,235,.18);padding:9px 13px;border-radius:999px;font-size:11px;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast[hidden]{display:none}
@keyframes sway{0%{transform:translate(-50%,-50%) rotate(calc(var(--r) - 2deg)) translateY(0) scale(var(--s))}100%{transform:translate(-50%,-50%) rotate(calc(var(--r) + 2deg)) translateY(-9px) scale(calc(var(--s) * 1.02))}}@keyframes pulse{0%{filter:drop-shadow(0 0 14px rgba(255,85,188,.18)) saturate(1.02) contrast(1.03)}100%{filter:drop-shadow(0 0 22px rgba(255,105,196,.28)) saturate(1.12) contrast(1.08)}}@keyframes glowShift{0%{background-position:0% 40%}100%{background-position:100% 60%}}@keyframes twinkle{from{opacity:.16;transform:scale(.7)}to{opacity:.68;transform:scale(1.18)}}
@media (max-width:720px){.brand h1{font-size:clamp(22px,6.2vw,30px)}.stage{top:52%;width:92vw;min-height:190px;padding:10px 8px 16px}.lyric{font-size:clamp(28px,8vw,42px);line-height:1.18}.controls-dock{width:min(290px,84vw)}}
@media (max-height:700px){.stage{top:49%;min-height:170px}.lyric{font-size:clamp(25px,6.4vw,36px)}}

/* The lyrics are the focus, with the playback dock sitting BELOW them. */
.stage{min-height:unset;height:auto;max-height:75dvh;gap:0;top:51%;padding:10px 10px 12px;justify-content:center}
.lyric{flex:0 0 auto;overflow:visible}
.controls-dock{flex-shrink:0;margin-top:24px}
.bouquet{filter:drop-shadow(0 0 19px rgba(255,103,181,.32)) saturate(1.08)}
/* Retracted player stays out of the way. Opening it gives a full 200×200 player. */
body.yt-collapsed .yt-shell{pointer-events:none}
.reveal-player{top:max(75px,calc(env(safe-area-inset-top) + 58px));cursor:pointer}
@media(max-width:720px){.stage{top:53%;padding:9px 8px 12px}.controls-dock{margin-top:20px}.lyric{font-size:clamp(27px,7.5vw,39px)}}
@media(max-height:700px){.stage{top:56%;max-height:74dvh}.lyric{font-size:clamp(24px,7vw,32px)}.controls-dock{margin-top:14px}}

/* Bottom-center retractable YouTube drawer (native player never below 200px). */
.yt-shell{
 left:50%; right:auto;
 top:auto;
 bottom:calc(max(12px,env(safe-area-inset-bottom)) + 46px);
 transform:translateX(-50%) translateY(0);
 width:200px; height:200px;
 z-index:15;
 border:1px solid rgba(255,210,239,.16);
 border-radius:14px;
 box-shadow:0 9px 30px rgba(0,0,0,.7),0 0 20px rgba(255,102,192,.13);
 transition:transform .38s ease,opacity .38s ease,visibility .38s ease;
}
.yt-shell iframe,.yt-shell #youtube-player{width:200px!important;height:200px!important}
body.yt-collapsed .yt-shell{
 transform:translateX(-50%) translateY(22px);
 opacity:0;visibility:hidden;pointer-events:none;
}
.reveal-player{
 position:fixed;
 left:50%;right:auto;
 top:auto;
 bottom:max(11px,env(safe-area-inset-bottom));
 transform:translateX(-50%);
 min-width:118px;
 height:36px;
 padding:0 17px;
 font-size:11px;font-weight:650;letter-spacing:.025em;
 border-radius:999px;
 border:1px solid rgba(255,216,245,.24);
 background:rgba(21,10,25,.82);
 box-shadow:0 0 17px rgba(241,91,177,.13);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 opacity:1;visibility:visible;display:grid;place-items:center;
 z-index:17;
}

/* Four touch-to-reveal love letters hidden in real, randomly picked lilies. */
#secret-lily-layer{position:fixed;inset:0;z-index:12;pointer-events:none;}
.secret-lily-trigger{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;min-width:54px;min-height:56px;
  padding:6px 4px;border:0;outline-offset:3px;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  background:transparent;color:#fff2f9;
  -webkit-tap-highlight-color:transparent;
  animation:secret-arrive .9s ease-out both;
}
.secret-lily-trigger[hidden],.secret-letter-overlay[hidden]{display:none!important;}
.secret-lily-trigger:focus-visible{outline:2px solid #ffe8f4;}
.secret-lily-halo{
  display:grid;place-items:center;width:36px;height:36px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,213,244,.27),rgba(255,103,191,.13) 46%,transparent 73%);
  font-size:25px;line-height:1;
  text-shadow:0 0 10px #ffafd9,0 0 24px #ff62b4;
  filter:drop-shadow(0 0 8px rgba(255,166,220,.67));
  animation:secret-beacon 2.8s ease-in-out infinite;
}
.secret-lily-hint{
  display:block;white-space:nowrap;text-transform:uppercase;
  font-family:Outfit,system-ui,sans-serif;font-size:8px;font-weight:700;
  letter-spacing:.07em;color:#ffe4f3;

  opacity:.9;
}

.secret-lily-trigger.secret-lily-picked .secret-lily-halo{animation:secret-beacon .8s ease-in-out infinite}
.bouquet.secret-lily-ready{filter:drop-shadow(0 0 24px rgba(255,120,211,.55)) saturate(1.2)}

}
@keyframes secret-arrive{

}

 if(secretLastFocus?.isConnected)secretLastFocus.focus({preventScroll:true});
 secretLastFocus=null;
}

secretLetterOverlay.addEventListener('click',ev=>{

/* A heart formed by thirteen translated love messages in the final instrumental.
   The lyrics at the start and all the other instrumental quotes are unchanged. */
const HEART_START=284.85;
const HEART_WORDS=[
 {text:"I love you",language:"English",x:27,y:17,delay:0},
 {text:"ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു",language:"Malayalam",x:73,y:17,delay:1.55},
 {text:"Te amo",language:"Spanish",x:13,y:32,delay:3.45},
 {text:"Je t’aime",language:"French",x:87,y:32,delay:5.25},
 {text:"Ti amo",language:"Italian",x:12,y:46,delay:7.10},
 {text:"Ich liebe dich",language:"German",x:88,y:46,delay:8.95},
 {text:"사랑해",language:"Korean",x:17,y:60,delay:10.80},
 {text:"愛してる",language:"Japanese",x:83,y:60,delay:12.65},
 {text:"أحبك",language:"Arabic",x:27,y:72,delay:14.50},
 {text:"我爱你",language:"Mandarin",x:73,y:72,delay:16.35},
 {text:"Eu te amo",language:"Portuguese",x:38,y:82,delay:18.20},
 {text:"Mahal kita",language:"Filipino",x:62,y:82,delay:20.05},
 {text:"நான் உன்னை காதலிக்கிறேன்",language:"Tamil",x:50,y:94,delay:22.0}
];
const heartFinale=document.createElement('div');
heartFinale.className='heart-finale';
heartFinale.hidden=true;
heartFinale.setAttribute('role','group');
heartFinale.setAttribute('aria-label','A heart formed from I love you in different languages, beginning with English and Malayalam');
heartFinale.innerHTML='<svg class="heart-sketch" viewBox="0 0 400 320" aria-hidden="true"><path d="M200 68 C153 7 73 -14 29 44 C-25 122 62 228 200 310 C338 228 425 122 371 44 C327 -14 247 7 200 68" /></svg><div class="heart-center"><span class="heart-center-symbol">♡</span><span>In every language,<span class="heart-center-break"> it’s always you.</span></span></div>';
const heartStroke=heartFinale.querySelector('.heart-sketch path');
let heartStrokePosition=-1;
const heartTextNodes=HEART_WORDS.map((entry,index)=>{
 const el=document.createElement('span');
 el.className='heart-language';
 el.textContent=entry.text;
 el.style.setProperty('--hx',entry.x+'%');
 el.style.setProperty('--hy',entry.y+'%');
 el.style.setProperty('--hue-index',String(index));
 el.setAttribute('lang',({Malayalam:'ml',Tamil:'ta',Korean:'ko',Japanese:'ja',Arabic:'ar',Mandarin:'zh',French:'fr',Spanish:'es',Italian:'it',German:'de',Portuguese:'pt',Filipino:'fil'})[entry.language]||'en');
 heartFinale.appendChild(el);
 return el;
});
document.body.appendChild(heartFinale);
let finaleActive=false;
function updateHeartFinale(t,force=false){
 const shouldShow=t>=HEART_START;
 if(!shouldShow){
  if(finaleActive){
   finaleActive=false;
   heartFinale.hidden=true;
   heartFinale.classList.remove('is-visible','is-complete');
   heartTextNodes.forEach(node=>node.classList.remove('is-bloomed'));
   heartStrokePosition=-1;
   heartStroke.style.strokeDashoffset='1200';
   lyricEl.classList.remove('heart-lyric-hidden');
   lastCue='';
  }
  return false;
 }
 if(!finaleActive){
  finaleActive=true;
  heartFinale.hidden=false;
  heartFinale.classList.add('is-visible');
  lyricEl.replaceChildren();
  lyricEl.classList.add('heart-lyric-hidden');
  lastCue='heart-finale';
 }
 let complete=true;
 for(let i=0;i<HEART_WORDS.length;i++){
  const revealed=t>=HEART_START+HEART_WORDS[i].delay;
  if(!revealed)complete=false;
  if(heartTextNodes[i].classList.contains('is-bloomed')!==revealed)
   heartTextNodes[i].classList.toggle('is-bloomed',revealed);
 }
 heartFinale.classList.toggle('is-complete',complete);
 // The outline now draws from the song clock and remains still when paused.
 const fraction=Math.min(1,Math.max(0,(t-HEART_START)/24));
 const offset=Math.round(1200*(1-fraction));
 if(heartStrokePosition!==offset){
   heartStroke.style.strokeDashoffset=String(offset);
   heartStrokePosition=offset;
 }
 return true;
}
function keepLilyHintsClear(){
 const caption=lyricEl.querySelector('.lyric-sentence');
 const activeText=finaleActive
  ? [heartFinale]
  : caption
    ? [...(caption.querySelectorAll('.ig-row').length
        ? caption.querySelectorAll('.ig-row'):[caption])]
    : [];
 // Read the tight text bounds; the caption container fills the entire
 // viewport width and would wrongly hide every 'touch me' prompt.
 const blocking=activeText.map(el=>el.getBoundingClientRect());
 const header=document.querySelector('.brand')?.getBoundingClientRect();
 const dock=document.querySelector('.controls-dock')?.getBoundingClientRect();
 if(header)blocking.push(header);
 if(dock)blocking.push(dock);
 function intersects(a,b,pad){
   return a.right>b.left-pad&&a.left<b.right+pad&&
          a.bottom>b.top-pad&&a.top<b.bottom+pad;
 }
 for(const {button} of secretButtons){
   if(button.hidden)continue;
   const hint=button.querySelector('.secret-lily-hint');
   if(!hint)continue;
   const buttonRect=button.getBoundingClientRect();
   const hintRect=hint.getBoundingClientRect();
   const textObscured=finaleActive||blocking.some(rect=>intersects(hintRect,rect,11));
   const flowerObscured=finaleActive||blocking.some(rect=>intersects(buttonRect,rect,3));
   button.classList.toggle('secret-hint-hidden',textObscured);
   button.classList.toggle('secret-lyric-nearby',flowerObscured);
 }
}

function showMessage(t){toast.textContent=t;toast.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.hidden=true,2600)}
function findCue(t){let lo=0,hi=cues.length-1;while(lo<=hi){const m=(lo+hi)>>1;if(cues[m].t<=t)lo=m+1;else hi=m-1}return Math.max(0,hi)}
function getCaption(t){if(t<26.13)return{key:t<12.9?'quote1':'quote2',text:t<12.9?q1:q2};const i=findCue(t),cue=cues[i],next=cues[i+1];if(cue&&cue.text)return{key:'lyric-'+i,text:cue.text};if(next&&cue&&next.t-cue.t<9){for(let j=i-1;j>=0;j--)if(cues[j].text)return{key:'lyric-'+j,text:cues[j].text}}const section=breaks.find(b=>t>=b.start&&t<b.end);if(section){let line=section.lines[0];for(const candidate of section.lines)if(t>=candidate.at)line=candidate;return{key:'note-'+line.at,text:line.text}}for(let j=i-1;j>=0;j--)if(cues[j].text)return{key:'lyric-'+j,text:cues[j].text};return{key:'quote1',text:q1}}
// Aligned to the supplied recording. Updates at each sentence boundary,
// with a short fade-out and slow, luminous fade-in.
// Positive look-ahead makes the displayed words appear earlier.
/* STABLE MUSIC-SYNCHRONIZED LYRICS V4: audio-clock opacity and movement.
   One span per word; no WAAPI, nested glyphs, or drifting transitions. */
const LYRIC_LINE_ADVANCE=0.20;
const LYRIC_WORD_ADVANCE=0.32;
const CAPTION_EXIT_LEAD=0.15;
const WORD_EASE_SECONDS=0.42;
let lyricTransitionId=0,lyricChangeTimer=null;
let captionWords=[],captionTimes=[],captionProgress=[];
let activeIsQuote=false,captionReady=true;
const lyricReducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const cachedCaptionSizes=new Map();
function fitLyric(){
 const container=lyricEl.closest('.stage'),sentence=lyricEl.querySelector('.lyric-sentence');
 if(!container||!sentence)return;
 const stack=sentence.querySelector('.ig-stack');
 const visibleW=window.visualViewport?.width||window.innerWidth;
 const visibleH=window.visualViewport?.height||window.innerHeight;
 const widthLimit=Math.max(75,Math.min(container.getBoundingClientRect().width-16,visibleW-16));
 const heightLimit=Math.max(54,Math.min(visibleH*.56,visibleH-105));
 const mobile=visibleW<=720;
 const minSize=visibleW<250?11:(stack?14:17);
 let size=stack
   ?(mobile?Math.min(33,Math.max(visibleW<290?14:23,visibleW*.076)):Math.min(43,Math.max(28,visibleW*.033)))
   :(mobile?Math.min(29,Math.max(visibleW<290?13:22,visibleW*.067)):Math.min(37,Math.max(25,visibleW*.039)));
 if(visibleH<650)size*=.90;
 if(visibleH<430)size*=.87;
 const textKey=(stack?'lyrics:':'quote:')+(sentence.textContent||'')+
  ':'+Math.round(visibleW/5)+':'+Math.round(visibleH/5);
 const cached=cachedCaptionSizes.get(textKey);
 if(cached){lyricEl.style.setProperty('font-size',cached+'px','important');return;}
 lyricEl.style.setProperty('font-size',size.toFixed(1)+'px','important');
 const wide=stack?Math.max(1,...[...stack.querySelectorAll('.ig-row')].map(row=>row.scrollWidth)):
  Math.max(1,sentence.scrollWidth);
 const high=Math.max(1,(stack||sentence).getBoundingClientRect().height);
 const ratio=Math.min(1,widthLimit/wide,heightLimit/high);
 if(ratio<.985)size=Math.max(minSize,size*ratio*.967);
 const finalSize=Number(size.toFixed(1));
 lyricEl.style.setProperty('font-size',finalSize+'px','important');
 if(cachedCaptionSizes.size>100)cachedCaptionSizes.clear();
 cachedCaptionSizes.set(textKey,finalSize);
}
let fitRequest=null;
function requestLyricFit(){
 if(fitRequest!==null)cancelAnimationFrame(fitRequest);
 cachedCaptionSizes.clear();
 fitRequest=requestAnimationFrame(()=>{fitRequest=null;fitLyric()});
}
// Preserves the original cue timing and word profiles.
const WORD_PROFILES={
  whenever:[0,.21,.46,.69,.87],
  youmake:[0,.10,.21,.35,.49,.57,.66,.81,.94],
  howeverfar:[0,.42,.75],
  howeverlong:[0,.34,.55,.79],
  whatever:[0,.31,.58,.79],
  always:[0,.17,.38,.66,.85],
  illalways:[0,.32,.67,.87],
  because:[0,.29,.56,.86]
};
function captionProfile(words){
 const x=words.map(w=>w.toLowerCase().replace(/[’']/g,"").replace(/[.,!?]/g,""));
 if(x[0]==='whenever')return WORD_PROFILES.whenever;
 if(x[0]==='you'&&x[1]==='make')return WORD_PROFILES.youmake;
 if(x[0]==='however'&&x[1]==='far')return WORD_PROFILES.howeverfar;
 if(x[0]==='however')return WORD_PROFILES.howeverlong;
 if(x[0]==='whatever')return WORD_PROFILES.whatever;
 if(x[0]==='i'&&x[1]==='will')return WORD_PROFILES.always;
 if(x[0]==='ill')return WORD_PROFILES.illalways;
 if(x[0]==='cause')return WORD_PROFILES.because;
 return words.map((_,i)=>words.length<=1?0:i/(words.length-1));
}
function getWordTimes(item,words){
 const i=Number(item.key.slice(6));
 const cue=cues[i];
 if(!Number.isInteger(i)||!cue)return words.map(()=>0);
 const next=cues[i+1];
 const span=next?Math.max(1,next.t-cue.t):4;
 // Leave the last portion of each musical line for held sung notes.
 const vocalSpan=Math.max(1.2,Math.min(6.65,span*.86,span-.36));
 const profile=captionProfile(words);
 return words.map((_,n)=>cue.t+vocalSpan*(profile[n]??(n/Math.max(1,words.length-1))));
}
function captionRows(words){
 const first=(words[0]||'').toLowerCase().replace(/[’']/g,"");
 if(first==='whenever')return [words.slice(0,1),words.slice(1,3),words.slice(3)];
 if(first==='you'&&words.length>=8)return [words.slice(0,3),words.slice(3,7),words.slice(7)];
 if(first==='i'&&words[1]?.toLowerCase()==='will')return [words.slice(0,2),words.slice(2,3),words.slice(3)];
 if(first==='however')return [words.slice(0,1),words.slice(1)];
 if(first==='whatever')return [words.slice(0,1),words.slice(1)];
 if(first.replace(/^'/,'')==='cause')return [words.slice(0,2),words.slice(2)];
 if(first==='ill'||first==="'ll"||first==="i'll")return [words.slice(0,2),words.slice(2)];
 const cut=Math.ceil(words.length/2);
 return [words.slice(0,cut),words.slice(cut)];
}


function syncCaptionWords(audioTime){
 if(!captionReady||activeIsQuote)return;
 for(let i=0;i<captionWords.length;i++){
   const el=captionWords[i];
   const raw=lyricReducedMotion.matches?
      (audioTime+LYRIC_WORD_ADVANCE>=captionTimes[i]?1:0):
      Math.max(0,Math.min(1,(audioTime-captionTimes[i]+LYRIC_WORD_ADVANCE)/WORD_EASE_SECONDS));
   if(Math.abs(raw-(captionProgress[i]??-1))<.004)continue;
   captionProgress[i]=raw;
   const eased=raw*raw*(3-2*raw);
   el.style.setProperty('opacity',eased.toFixed(3),'important');
   el.style.setProperty('transform','translate3d(0,'+((1-eased)*9).toFixed(2)+'px,0) scale('+
     (0.975+0.025*eased).toFixed(4)+')','important');
 }
}
function installCaption(item,audioTime,force=false){
 ++lyricTransitionId;
 clearTimeout(lyricChangeTimer);
 captionWords=[];captionTimes=[];captionProgress=[];captionReady=false;
 const reduced=lyricReducedMotion.matches;
 const isQuote=item.key==='quote1'||item.key==='quote2'||item.key.startsWith('note-');
 activeIsQuote=isQuote;
 const sentence=document.createElement('span');
 sentence.className='lyric-sentence '+(isQuote?'caption-quote':'caption-lyric')+
   (isQuote&&!force&&!reduced?' is-entering':' is-current');
 if(isQuote)sentence.textContent=item.text||' ';
 else{
   const words=(item.text||'').split(/\s+/).filter(Boolean),stack=document.createElement('span');
   stack.className='ig-stack';
   for(const [rowNumber,parts] of captionRows(words).filter(row=>row.length).entries()){
     const row=document.createElement('span');row.className='ig-row ig-tier-'+Math.min(rowNumber+1,3);
     for(const part of parts){
       const word=document.createElement('span');
       word.className='ig-word';word.textContent=part;row.appendChild(word);captionWords.push(word);
     }
     stack.appendChild(row);
   }
   sentence.appendChild(stack);
   captionTimes=getWordTimes(item,words);
   captionProgress=new Array(captionWords.length).fill(-1);
 }
 lyricEl.replaceChildren(sentence);
 fitLyric();
 captionReady=true;
 if(isQuote&&!force&&!reduced){
   requestAnimationFrame(()=>{
     if(!sentence.isConnected)return;
     sentence.getBoundingClientRect();
     sentence.classList.remove('is-entering');sentence.classList.add('is-current');
   });
 }else syncCaptionWords(audioTime);
}
function displayLyric(t,force=false){
 if(updateHeartFinale(t,force))return;
 const currentTime=Math.max(0,t),item=getCaption(currentTime+LYRIC_LINE_ADVANCE);
 if(force||item.key!==lastCue){lastCue=item.key;installCaption(item,currentTime,force)}
 const sentence=lyricEl.querySelector('.lyric-sentence');
 if(sentence){
  const next=getCaption(currentTime+LYRIC_LINE_ADVANCE+CAPTION_EXIT_LEAD);
  const fading=!force&&!music.paused&&next.key!==item.key;
  if(sentence.classList.contains('is-exiting')!==fading)sentence.classList.toggle('is-exiting',fading);
 }
 syncCaptionWords(currentTime);
}

const music=document.getElementById('lovesong-audio');
function playSong(){
 if(music.error){showMessage('Audio could not load. Please refresh.');return}
 const p=music.play();
 if(p&&p.catch)p.catch(()=>showMessage('Tap Play again to start Lovesong ♡'));
}
function pauseSong(){music.pause()}
function seekSong(value){
 const next=Math.max(0,Math.min(Number.isFinite(music.duration)?music.duration:durationSeconds,value));
 if(music.readyState>0)music.currentTime=next;
 positionSeconds=next;lastCue='';displayLyric(next,true);updateSecretLilies(next);
}
playBtn.addEventListener('click',playSong);
pauseBtn.addEventListener('click',pauseSong);
rewindBtn.addEventListener('click',()=>seekSong((music.currentTime||0)-10));
seek.addEventListener('input',()=>seekSong(Number(seek.value)/1000*durationSeconds));
function formatTime(t){const n=Math.max(0,Math.floor(Number.isFinite(t)?t:0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function updateButtons(){
 const isPlaying=!music.paused&&!music.ended;
 playBtn.style.opacity=isPlaying?'.65':'1';
 pauseBtn.style.opacity=isPlaying?'1':'.65';
 playBtn.setAttribute('aria-label',isPlaying?'Playing Lovesong':'Play Lovesong');
}
music.addEventListener('loadedmetadata',()=>{
 if(Number.isFinite(music.duration)&&music.duration>0)durationSeconds=music.duration;
});
music.addEventListener('timeupdate',()=>{positionSeconds=music.currentTime||0});
music.addEventListener('seeked',()=>{const t=music.currentTime||0;displayLyric(t,true);updateSecretLilies(t)});
music.addEventListener('play',()=>{document.body.classList.add('has-song');updateButtons()});
music.addEventListener('pause',updateButtons);
music.addEventListener('ended',()=>{showMessage('For you, always ♡');updateButtons()});
music.addEventListener('error',()=>showMessage('Music file unavailable. Please refresh.'));

/* Keep the title, lyrics and controls inside the ACTUAL visible viewport
   during mobile pinch-zoom and desktop browser zoom (without blocking zoom). */
let viewportUpdatePending=false;
let lastViewportMetrics='';
function updateVisibleViewport(){
 viewportUpdatePending=false;
 const v=window.visualViewport;
 const w=Math.max(100,Math.min(window.innerWidth,v?.width||window.innerWidth));
 const h=Math.max(100,Math.min(window.innerHeight,v?.height||window.innerHeight));
 const x=Math.max(0,v?.offsetLeft||0);
 const y=Math.max(0,v?.offsetTop||0);
 const dockHeight=document.querySelector('.controls-dock')?.getBoundingClientRect().height||65;
 const headSpace=w<290?42:(w<640?54:67);
 const dockSpace=Math.max(62,Math.min(115,dockHeight+19));
 const center=y+headSpace+Math.max(18,h-headSpace-dockSpace)*.5;
 const root=document.documentElement;
 const px=(name,value)=>root.style.setProperty(name,value.toFixed(2)+'px');
 px('--vv-center-x',x+w/2);
 px('--vv-stage-y',center);
 px('--vv-top',y);
 px('--vv-width',w);
 px('--vv-height',h);
 px('--vv-title-size',Math.max(14,Math.min(32,w*.061)));
 px('--vv-dock-bottom',Math.max(0,window.innerHeight-y-h)+Math.min(13,Math.max(5,h*.025)));
 px('--vv-head-reserve',headSpace);
 px('--vv-dock-reserve',dockSpace);
 root.classList.toggle('viewport-compact',w<290||h<400);
 const dimensions=Math.round(w)+'x'+Math.round(h);
 if(dimensions!==lastViewportMetrics){
   lastViewportMetrics=dimensions;
   requestLyricFit();
 }
}
function scheduleVisibleViewport(){
 if(viewportUpdatePending)return;
 viewportUpdatePending=true;
 requestAnimationFrame(updateVisibleViewport);
}
window.addEventListener('resize',scheduleVisibleViewport,{passive:true});
window.addEventListener('orientationchange',scheduleVisibleViewport,{passive:true});
window.visualViewport?.addEventListener('resize',scheduleVisibleViewport,{passive:true});
window.visualViewport?.addEventListener('scroll',scheduleVisibleViewport,{passive:true});

let lastFrame=0;
function frame(now){
 requestAnimationFrame(frame);
 const t=Number.isFinite(music.currentTime)?music.currentTime:positionSeconds;
 positionSeconds=t;
 // Use the audio element's clock every display frame, avoiding the old ~90 ms
 // word-reveal quantisation and all artificial 260 ms caption entry delays.
 displayLyric(t);
 updateSecretLilies(t);
 if(now-lastFrame>=110){
   keepLilyHintsClear();
   lastFrame=now;
   timeEl.textContent=formatTime(t)+' / '+formatTime(durationSeconds);
   seek.value=String(Math.min(1000,Math.round(t/Math.max(1,durationSeconds)*1000)));
   lastTime=t;
 }
}
// Responsive portrait/landscape fitting without restarting music or captions.
window.addEventListener('resize',requestLyricFit,{passive:true});
if(document.fonts?.ready)document.fonts.ready.then(requestLyricFit);
updateButtons();
updateVisibleViewport();
displayLyric(0,true);
requestAnimationFrame(frame);
})();
