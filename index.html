.bouquet::before,.bouquet::after{content:"";position:absolute;inset:0;background:inherit;background-size:contain;background-position:center;background-repeat:no-repeat;mix-blend-mode:screen;opacity:.22;filter:blur(2px)}.bouquet::before{transform:translate(1.2%,-.6%) skewY(.8deg)}.bouquet::after{transform:translate(-1.4%,.8%) skewX(-1deg);opacity:.14}
.stage{position:fixed;left:50%;top:49%;transform:translate(-50%,-50%);z-index:8;width:min(90vw,760px);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 16px 24px;pointer-events:none}.stage::before{content:"";position:absolute;inset:-16px -10px;border-radius:30px;background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));border:1px solid rgba(255,200,235,.14);box-shadow:0 0 46px rgba(255,80,180,.12), inset 0 1px 0 rgba(255,255,255,.09);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:-1}
.brand{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:10;width:94vw;text-align:center;pointer-events:none}.brand h1{margin:0;font-size:clamp(24px,5.2vw,38px);font-weight:750;letter-spacing:-.03em;color:#ffe8f6;text-shadow:0 0 12px rgba(255,92,191,.34),0 0 26px rgba(255,92,191,.15)}
.lyric{margin:0;max-width:100%;font-family:Georgia,serif;font-size:clamp(30px,6vw,56px);line-height:1.22;letter-spacing:-.03em;color:#fff6fc;text-wrap:balance;white-space:normal;overflow-wrap:break-word;text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 18px rgba(255,92,191,.18);transition:opacity .7s ease, transform .7s ease}.lyric.glow{background:linear-gradient(110deg,#fff6fc 0%,#ffc6e9 20%,#fff6ff 38%,#ffe0f5 55%,#f5b8ff 74%,#ff9cda 87%,#fff7fd 100%);background-size:230% 230%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,95,198,.42));animation:glowShift 10s ease-in-out infinite alternate}.lyric.switching{opacity:0;transform:translateY(12px) scale(.985)}
.start-btn{margin-top:26px;padding:13px 24px;border-radius:999px;border:1px solid rgba(255,210,237,.55);background:linear-gradient(120deg, rgba(228,84,176,.88), rgba(133,74,214,.86));color:#fff;font-size:12px;font-weight:700;letter-spacing:.07em;box-shadow:0 0 24px rgba(255,60,177,.28), inset 0 1px 0 rgba(255,255,255,.22);pointer-events:auto}body.has-song .start-btn{display:none}
.controls-dock{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:14;width:min(210px,calc(100vw - 20px));padding:9px 8px 8px;border-radius:16px;background:rgba(12,8,18,.62);border:1px solid rgba(255,196,229,.17);box-shadow:0 12px 32px rgba(0,0,0,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.controls{display:flex;align-items:center;gap:6px}.ctrl{display:grid;place-items:center;min-width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,215,243,.18);background:rgba(255,255,255,.06);color:#fff4fb;padding:0 4px;line-height:1;font-size:15px}.ctrl.play{min-width:36px;height:36px;font-size:17px;background:linear-gradient(120deg, rgba(238,83,182,.84), rgba(133,95,247,.84));box-shadow:0 0 16px rgba(255,91,190,.18)}.ctrl small{font-size:9px}.song-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:#ffeef9;font-weight:650}.yt-link{text-decoration:none}.progress{display:flex;align-items:center;gap:6px;margin-top:7px}.progress input{flex:1;min-width:0;height:15px;accent-color:#ff85d4}.time{font-size:9px;color:#d5bfd5;white-space:nowrap;font-variant-numeric:tabular-nums}
.yt-shell{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 88px);z-index:15;width:200px;height:200px;border-radius:12px;overflow:hidden;background:#000;border:1px solid rgba(255,210,235,.18);box-shadow:0 8px 28px rgba(0,0,0,.42),0 0 16px rgba(255,90,188,.12);transform-origin:100% 100%;transition:transform .45s ease, opacity .45s ease, visibility .45s ease}.yt-shell iframe,.yt-shell #youtube-player{display:block;width:200px!important;height:200px!important;border:0;background:#000}body.yt-collapsed .yt-shell{transform:none;opacity:1;visibility:visible}.reveal-player{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 96px);z-index:16;width:36px;height:36px;border-radius:50%;display:none;place-items:center;background:rgba(255,84,180,.2);border:1px solid rgba(255,205,236,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;text-decoration:none;box-shadow:0 0 14px rgba(255,84,180,.12)}body.yt-collapsed .reveal-player{display:grid}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:20;background:rgba(10,8,18,.92);color:#fff;border:1px solid rgba(255,212,235,.24);padding:9px 13px;border-radius:999px;font-size:11px;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast[hidden]{display:none}.particles .spark{position:absolute;width:var(--s);height:var(--s);left:var(--x);top:var(--y);border-radius:50%;background:rgba(255,190,226,.86);box-shadow:0 0 10px rgba(255,190,226,.38);opacity:.55;animation:twinkle var(--d) ease-in-out infinite alternate}
@keyframes sway{0%{transform:translate(-50%,-50%) rotate(calc(var(--r) - 2deg)) translateY(0) scale(var(--s))}100%{transform:translate(-50%,-50%) rotate(calc(var(--r) + 2deg)) translateY(-8px) scale(calc(var(--s) * 1.02))}}@keyframes pulse{0%{filter:drop-shadow(0 0 12px rgba(255,85,188,.18)) saturate(1.02) contrast(1.03)}100%{filter:drop-shadow(0 0 18px rgba(255,105,196,.28)) saturate(1.12) contrast(1.08)}}@keyframes glowShift{0%{background-position:0% 40%}100%{background-position:100% 60%}}@keyframes twinkle{from{opacity:.18;transform:scale(.6)}to{opacity:.72;transform:scale(1.2)}}
@media (max-width:720px){.brand h1{font-size:clamp(22px,6.2vw,30px)}.stage{top:44%;width:92vw;min-height:190px;padding:18px 12px 20px}.lyric{font-size:clamp(28px,8vw,42px);line-height:1.18}.controls-dock{width:192px}.yt-shell{width:200px;height:200px}.yt-shell iframe,.yt-shell #youtube-player{width:200px!important;height:200px!important}}@media (max-height:700px){.stage{top:40%;min-height:170px}.lyric{font-size:clamp(24px,6.4vw,36px)}}

/* Official player stays visible at the required minimum dimensions. */
.yt-shell,body.yt-collapsed .yt-shell{transform:none!important;opacity:1!important;visibility:visible!important;width:200px!important;height:200px!important}

g(){ return ytReady && ytState===YT.PlayerState.PLAYING; }function updatePlay(){ const playing=isPlaying(); playBtn.textContent=playing?'❚❚':'▶'; playBtn.title=playing?'Pause':'Play'; playBtn.setAttribute('aria-label',playing?'Pause Lovesong':'Play Lovesong'); document.body.classList.toggle('is-playing',playing); }function collapsePlayer(){ /* Leave the YouTube player visible for permitted playback. */ }function expandPlayer(){ document.body.classList.remove('yt-collapsed'); }function playOrPause(){ if(!ytReady||!ytPlayer){ queuedPlay=true; showMessage('Preparing the YouTube song…'); return; } try{ if(isPlaying()) ytPlayer.pauseVideo(); else { ytPlayer.playVideo(); document.body.classList.add('has-song'); collapsePlayer(); } }catch(e){ showMessage('Tap Play again in a moment ♡'); } }mainBtn.addEventListener('click', playOrPause); playBtn.addEventListener('click', playOrPause);revealBtn.addEventListener('click', ()=>{expandPlayer(); showMessage('Player revealed');});rewindBtn.addEventListener('click', ()=>{ if(!ytReady||!ytPlayer){showMessage('Loading the song…'); return;} const next=Math.max(0,youtubeTime()-10); ytPlayer.seekTo(next,true); lastCue=''; displayLyric(next); });seek.addEventListener('input', ()=>{ if(!ytReady||!ytPlayer) return; const next=Number(seek.value)/1000*youtubeDuration(); ytPlayer.seekTo(next,true); lastCue=''; displayLyric(next); });function formatTime(t){ const n=Math.max(0,Math.floor(Number.isFinite(t)?t:0)); return Math.floor(n/60)+':'+String(n%60).padStart(2,'0'); }let lastFrame=0; function frame(now){ requestAnimationFrame(frame); if(now-lastFrame<85) return; lastFrame=now; const t=youtubeTime(), d=youtubeDuration(); displayLyric(t); timeEl.textContent=formatTime(t)+' / '+formatTime(d); seek.value=String(Math.min(1000, Math.round(t/Math.max(1,d)*1000))); lastTime=t; }function initYoutube(){ const script=document.createElement('script'); script.src='https://www.youtube.com/iframe_api'; script.async=true; script.onerror=()=>showMessage('Yo
