<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Ente Mariammekku — original textured stargazer lilies and synchronized love-song lyrics.">
<title>Ente Mariammekku 🌸💗</title>
<style>
 html,body{height:100%;height:100dvh;width:100%;margin:0;background:#000;overflow:hidden}
 #original-site{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:block;border:0;z-index:1;background:#000}
 #individual-lily-garden{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
 @media(max-width:899px){#individual-lily-garden{display:none!important}}
</style>
<link rel="stylesheet" href="./desktop-garden.css?v=airy-lilies-1">
</head>
<body>
<iframe id="original-site" src="./site-original.html" title="Ente Mariammekku — song and lyrics" allow="autoplay" loading="eager"></iframe>
<div id="individual-lily-garden" aria-hidden="true"></div>
<script>
(()=>{
 'use strict';
 const frame=document.getElementById('original-site');
 frame.addEventListener('load',()=>{
   try{
     const doc=frame.contentDocument;
     if(!doc||doc.getElementById('unique-garden-base-style'))return;
     const st=doc.createElement('style');
     st.id='unique-garden-base-style';
     st.textContent='@media(min-width:900px){'+
       '#bouquets>.bouquet{opacity:.025!important}'+
       '#bouquets>.bouquet:nth-child(-n+4),'+
       '#bouquets>.bouquet:nth-child(n+17):nth-child(-n+20),'+
       '#bouquets>.bouquet:nth-child(n+33):nth-child(-n+35){opacity:.14!important}'+
       '#desktop-lily-garden{display:none!important}'+
       '}';
     doc.head.appendChild(st);
   }catch(e){console.warn('Original lily garden preserved',e)}
 });
})();
</script>
<script src="./desktop-garden.js?v=airy-lilies-1" defer></script>
</body>
</html>
