<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>Ente Mariammekku 🌸💗</title>
<style>html,body{margin:0;min-height:100%;background:#000;color:#ffe6f5;font-family:system-ui,sans-serif}#loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}#loading strong{font-size:clamp(19px,4vw,29px);font-weight:600;letter-spacing:.01em;text-shadow:0 0 17px rgba(255,93,197,.4)}#loading span{color:#c48aaf;font-size:12px}a{color:#f7b3dc}</style>
</head>
<body><main id="loading"><strong>🌸 Ente Mariammekku 🌸</strong><span>Opening the lily garden…</span></main>
<script>
(async()=>{
  try {
    const response=await fetch('./site-original.html',{cache:'no-cache'});
    if(!response.ok)throw new Error('Unable to load the garden');
    let html=await response.text();
    const replace=(a,b,name)=>{
      if(!html.includes(a))throw new Error('Missing website section: '+name);
      html=html.replace(a,b);
    };
    replace('</style></head>',
      '</style><link rel="stylesheet" href="./desktop-garden.css?v=20261026-5"></head>',
      'enhancements');
    /* Keep the existing photos but omit expensive unused desktop vector flowers. */
    replace('desktopLilyPositions.forEach((p,i)=>{','[].forEach((p,i)=>{','vector performance');
    /* Preserve all the hand-aligned MP3 cue points and private heart animations.
       Transition old sentence out while the next is timed to the native audio clock. */
    replace(' lyricEl.replaceChildren(sentence);\n fitLyric();',
      ' const leaving=lyricEl.querySelector(".lyric-sentence");\n'+
      ' if(leaving&&!force&&!reduced){\n'+
      '  leaving.classList.add("lyric-leaving");\n'+
      '  leaving.classList.remove("is-exiting","is-entering","is-current");\n'+
      '  leaving.setAttribute("aria-hidden","true");\n'+
      '  lyricEl.replaceChildren(leaving,sentence);\n'+
      '  requestAnimationFrame(()=>{if(leaving.isConnected)leaving.classList.add("lyric-leaving-active")});\n'+
      '  setTimeout(()=>{if(leaving.isConnected)leaving.remove()},390);\n'+
      ' } else {lyricEl.replaceChildren(sentence)}\n fitLyric();',
      'smooth caption transition');
    // Load the extra ORIGINAL lilies after the page's own script,
    // inside the same execution block. This avoids browser script-order races.
    const addonResponse=await fetch('./desktop-garden.js?v=20261026-5',{cache:'no-cache'});
    if(!addonResponse.ok)throw new Error('Original lily decorations could not load');
    const originalLilyFill=await addonResponse.text();
    const tail='</scr'+'ipt></body></html>';
    replace(tail,'\n'+originalLilyFill+'\n'+tail,'additional original lilies');
    document.open('text/html','replace');
    document.write(html);
    document.close();
  } catch(error) {
    console.error('Garden enhancement loading error:',error);
    const note=document.querySelector('#loading span');
    if(note)note.innerHTML='The enhanced view could not load. <a href="./site-original.html">Open the original garden</a>';
  }
})();
</script>
</body>
</html>
